name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Validate
        run: |
          go test -race ./...
          go vet ./...
          node --check deploy/cloudflare-worker/src/index.js
          sh -n scripts/build-all.sh scripts/install.sh scripts/install-service.sh scripts/bootstrap-webdav.sh scripts/update.sh scripts/uninstall.sh
          sh tests/bootstrap-webdav.sh
          sh tests/lifecycle.sh
      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}" ./scripts/build-all.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --title "codex-auth-sync $GITHUB_REF_NAME"
