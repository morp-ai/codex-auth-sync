name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - run: go test ./...
      - run: go vet ./...
      - run: node --check deploy/cloudflare-worker/src/index.js
      - run: sh -n scripts/build-all.sh scripts/install.sh scripts/install-service.sh scripts/bootstrap-webdav.sh scripts/update.sh scripts/uninstall.sh
      - run: sh tests/bootstrap-webdav.sh
      - run: sh tests/lifecycle.sh
      - run: VERSION=ci ./scripts/build-all.sh

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell installers
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @(
            "scripts/install.ps1",
            "scripts/install-service.ps1",
            "scripts/bootstrap-webdav.ps1",
            "scripts/update.ps1",
            "scripts/uninstall.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) > $null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path`: $_" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
