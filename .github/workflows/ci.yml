name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - run: go test ./...
      - run: go vet ./...
      - run: node --check deploy/cloudflare-worker/src/index.js
      - run: VERSION=ci ./scripts/build-all.sh
